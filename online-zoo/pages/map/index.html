<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online-zoo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../../assets/contact/Favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="../../assets/contact/Logo.svg" alt="Online-zoo logo">
            </div>
            <nav>
                <ul class="header-nav">
                    <li><a href="../landing/index.html">About</a></li>
                    <li><a href="../map/index.html" class="active">Map</a></li>
                    <li><a href="../animals/index.html">Zoos</a></li>
                    <li><a href="../contact/index.html">Contact us</a></li>
                    <li><a href="../contact/index.html">Design</a></li>
                </ul>
            </nav>
            <div class="header-social">
                <a href="https://www.youtube.com"><img src="../../assets/contact/YouTube.svg" alt="YouTube"></a>
                <a href="https://www.instagram.com"><img src="../../assets/contact/Instagram.svg" alt="Instagram"></a>
                <a href="https://www.facebook.com"><img src="../../assets/contact/Facebook.svg" alt="Facebook"></a>
            </div>
            <div class="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>
        <main>
            <div class="main-content">
                <h1 class="main-title">find where are <br> the animals live</h1>
                <div class="map">
                    <img src="../../assets/map/map.svg" alt="Map">
                    <div class="map-pins">
                        <div class="pin eagle-svg"><img src="../../assets/map/Eagle.svg" alt="Eagle location"></div>
                        <div class="pin alligator-svg"><img src="../../assets/map/Alligator.svg" alt="Alligator location"></div>
                        <div class="pin lion-svg"><img src="../../assets/map/Lion.svg" alt="Lion location"></div>
                        <div class="pin gorilla-svg"><img src="../../assets/map/Gorilla.svg" alt="Gorilla location"></div>
                        <div class="pin lemur-svg"><img src="../../assets/map/Lemur.svg" alt="Lemur location"></div>
                        <div class="pin panda-svg"><img src="../../assets/map/Panda.svg" alt="Panda location"></div>
                        <div class="pin tiger-svg"><img src="../../assets/map/Tiger.svg" alt="Tiger location"></div>
                        <div class="pin koala-svg"><img src="../../assets/map/Coala.svg" alt="Coala location"></div>
                </div>
            </div>
        </main>
        <footer>
            <div class="footer-logo-nav">
                <div class="footer-logos">
                    <img src="../../assets/contact/Logo white.svg" alt="Online-zoo logo">
                    <img src="../../assets/contact/Yem Digital.svg" alt="Yem Digital logo">
                    <img src="../../assets/contact/rs_school_js logo.svg" alt="RS School logo">
                </div>
                <nav>
                    <ul class="footer-nav">
                        <li><a href="../landing/index.html">About</a></li>
                        <li><a href="../map/index.html">Map</a></li>
                        <li><a href="../animals/index.html">Zoos</a></li>
                        <li><a href="../contact/index.html">Contact us</a></li>
                    </ul>
                </nav>
                <button class="footer-button">Donate for volunteers
                    <img src="../../assets/contact/button-arrow.svg" alt="Arrow">
                </button>
            </div>
            <div class="footer-line"></div>
            <div class="footer-author-social">
                <div class="footer-author">
                    <span>© 2021 DinaK</span>
                    <span>© Yem Digital</span>
                    <span>RSSchool</span>
                </div>
                <div class="footer-social">
                    <span class="line-small-screen"></span>
                    <a href="https://www.youtube.com"><img src="../../assets/contact/YouTube.svg" alt="YouTube"></a>
                    <a href="https://www.instagram.com"><img src="../../assets/contact/Instagram.svg" alt="Instagram"></a>
                    <a href="https://www.facebook.com"><img src="../../assets/contact/Facebook.svg" alt="Facebook"></a>
                </div>
            </div>
