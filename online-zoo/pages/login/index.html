<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../global.scss" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="../../assets/contact/Favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <div class="container">
      <div id="headerContainer"></div>
      <main class="auth-page">
        <h1>Sign In</h1>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="login">Login</label>
            <input id="login" type="text" placeholder="Enter login" />
            <div class="error-message" id="loginValidation"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter password" />
            <div class="error-message" id="passwordValidation"></div>
          </div>

          <div class="error-message" id="loginError"></div>

          <button id="signInButton" type="button" disabled>Sign In</button>
        </form>

        <p>
          Don't have an account?
          <a href="../register/index.html">Register</a>
        </p>
      </main>
    </div>

    <script type="module" src="../../scripts/pages/login.ts"></script>
  </body>
</html>
